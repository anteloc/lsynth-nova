# Publishes a GitHub release with the wheel and sdist whenever a "v*" tag on master is pushed
# (git push origin v1.2.3), or created from the GitHub UI's "Draft a new release" page.
# It can also be started from the Actions tab ("Run workflow" on master, with a tag such as v1.2.3):
# the tag is then created on master's head commit together with the release.
# The package version is taken from the tag (v1.2.3 -> 1.2.3), overriding pyproject.toml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create on master and release, e.g. v1.2.3"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag name and that the commit is on master
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*([.-]?[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3."
            exit 1
          fi
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$TAG ($GITHUB_SHA) is not on master; not releasing."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; push it again or delete it instead."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set the package version from the tag
        run: |
          VERSION="${TAG#v}"
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          grep -q "^version = \"$VERSION\"$" pyproject.toml
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pytest -q

      - name: Build wheel and sdist
        run: |
          pip install build
          rm -rf dist
          python -m build
          ls -l dist

      - name: Check the wheel installs and runs
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/lsynth --version

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (e.g. created from the GitHub UI): just attach the files.
            gh release upload "$TAG" dist/* --clobber
          else
            # On workflow_dispatch the tag does not exist yet and is created at the built commit.
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
